version: 2

models:
  - name: int_facebook__ads_stat
    description: "Cleaned and deduplicated daily Facebook ad performance metrics."
    columns:
      - name: ad_id
        description: "The unique identifier for the ad."
        tests:
          - not_null
          - relationships:
              to: ref('int_facebook__ads_enriched')
              field: ad_id
      - name: account_id
        description: "The ad account identifier."
        tests:
          - not_null
      - name: ad_date
        description: "The calendar date of the performance metrics."
        tests:
          - not_null
      - name: spend
        description: "Total spend for the ad on the given date (nulls replaced with 0.00)."
      - name: impressions
        description: "Total impressions for the ad on the given date (nulls replaced with 0)."
      - name: clicks
        description: "Total clicks for the ad on the given date (nulls replaced with 0)."
      - name: data_source
        description: "Source platform tag ('facebook_ads')."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - ad_id
            - account_id
            - ad_date

  - name: int_facebook__ads_enriched
    description: "Enriched wide dimension model for Facebook ads combining account, campaign, adgroup, and ad metadata."
    columns:
      - name: ad_id
        description: "The unique primary key for the ad."
        tests:
          - unique
          - not_null
      - name: account_id
        description: "Foreign key for the parent ad account."
      - name: campaign_id
        description: "Foreign key for the parent campaign."
      - name: adgroup_id
        description: "Foreign key for the parent ad group."
      - name: account_name
        description: "Name of the ad account."
      - name: campaign_name
        description: "Name of the marketing campaign."
      - name: ad_group_name
        description: "Name of the ad group."
      - name: ad_name
        description: "Name of the individual ad creative."
      - name: currency
        description: "Account-level currency code."
      - name: ad_status
        description: "Operational status of the ad."
        tests:
          - accepted_values:
              values: ['ACTIVE', 'PAUSED', 'ARCHIVED', 'DELETED']
      - name: account_created_at
        description: "Timestamp when the account was created."
      - name: account_updated_at
        description: "Timestamp when the account record was last updated."
      - name: campaign_updated_at
        description: "Timestamp when the campaign record was last updated."
      - name: adgroup_updated_at
        description: "Timestamp when the ad group record was last updated."
      - name: ad_updated_at
        description: "Timestamp when the ad record was last updated."
      - name: data_source
        description: "Source platform identifier tag ('facebook_ads')."
        tests:
          - not_null