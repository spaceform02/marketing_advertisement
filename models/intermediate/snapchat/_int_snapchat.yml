version: 2

models:
  - name: int_snapchat__ads_stats
    description: "Cleaned and deduplicated daily Snapchat ad performance metrics broken down by country."
    columns:
      - name: ad_id
        description: "The unique ad identifier."
        tests:
          - not_null
          - relationships:
              to: ref('int_snapchat__ads_enriched')
              field: ad_id
      - name: ad_date
        description: "The calendar date of the ad performance metrics."
        tests:
          - not_null
      - name: country
        description: "Standardized country name where the ad was served."
        tests:
          - not_null
      - name: spend
        description: "Total spend for the ad on the given date (nulls replaced with 0.00)."
      - name: impressions
        description: "Total impressions for the ad on the given date (nulls replaced with 0)."
      - name: clicks
        description: "Total clicks for the ad on the given date (nulls replaced with 0)."
      - name: currrency
        description: "Original currency code."
      - name: data_source
        description: "Source platform tag."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - ad_id
            - ad_date
            - country

  - name: int_snapchat__ads_enriched
    description: "Enriched wide dimension model for Snapchat ads joining account, campaign, and ad group metadata."
    columns:
      - name: ad_id
        description: "The unique primary key for the ad."
        tests:
          - unique
          - not_null
      - name: account_id
        description: "Foreign key for the parent account."
      - name: campaign_id
        description: "Foreign key for the parent campaign."
      - name: adgroup_id
        description: "Foreign key for the parent ad group."
      - name: campaign_name
        description: "Name of the marketing campaign."
      - name: adgroup_name
        description: "Name of the ad group."
      - name: ad_name
        description: "Name of the individual ad creative."
      - name: adgroup_updated_at
        description: "Timestamp when the ad group record was last updated."
      - name: ad_updated_at
        description: "Timestamp when the ad record was last updated."
      - name: data_source
        description: "Source platform identifier tag ('snapchat_ads')."
        tests:
          - not_null