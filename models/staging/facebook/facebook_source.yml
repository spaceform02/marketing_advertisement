version: 2

sources:
  - name: facebook_ads
    description: "Raw Facebook Ads data ingested from Google Drive."
    database: marketing_prod
    schema: raw
    config:
      enabled: true
      freshness:
        warn_after:
          count: 2
          period: day

    tables:
      - name: ads_stats
        description: "Fact table containing Facebook ad performance metrics."
        identifier: ads_stats
        config:
          enabled: true
          event_time: ad_date
        columns:
          - name: ad_id
            description: "Unique identifier for the advertisement."
          - name: account_id
            description: "Identifier of the advertising account."
          - name: ad_spend
            description: "Amount spent on the advertisement."
          - name: ad_impressions
            description: "Number of times the advertisement was displayed."
          - name: ad_clicks
            description: "Number of clicks received by the advertisement."
          - name: ad_date
            description: "Date associated with the ad performance record."

      - name: accounts
        description: "Account dimension containing Facebook advertising account attributes."
        identifier: new_acccount_de_randomized
        config:
          enabled: true
          event_time: account_updated_at
        columns:
          - name: account_id
            description: "Unique identifier for the advertising account."
          - name: account_name
            description: "Name of the advertising account."
          - name: ad_currency_code
            description: "Currency code used by the advertising account."
          - name: account_created_at
            description: "Timestamp when the account was created."
          - name: account_updated_at
            description: "Timestamp when the account record was last updated."

      - name: adgroups
        description: "Ad group dimension containing ad group attributes."
        identifier: new_adgroup_de_randomized
        config:
          enabled: true
          event_time: ad_group_updated_at
        columns:
          - name: ad_group_id
            description: "Unique identifier for the ad group."
          - name: ad_group_name
            description: "Name of the ad group."
          - name: ad_group_updated_at
            description: "Timestamp when the ad group record was last updated."

      - name: ads
        description: "Advertisement dimension containing descriptive ad attributes."
        identifier: new_ads_de_randomized
        config:
          enabled: true
          event_time: ad_updated_at
        columns:
          - name: ad_id
            description: "Unique identifier for the advertisement."
          - name: campaign_id
            description: "Identifier of the campaign associated with the ad."
          - name: ad_group_id
            description: "Identifier of the ad group associated with the ad."
          - name: account_id
            description: "Identifier of the advertising account."
          - name: ad_name
            description: "Name of the advertisement."
          - name: ad_status
            description: "Current status of the advertisement."
          - name: ad_updated_at
            description: "Timestamp when the ad record was last updated."

      - name: campaigns
        description: "Campaign dimension containing Facebook advertising campaign attributes."
        identifier: new_campaign_de_randomized
        config:
          enabled: true
          event_time: campaign_updated_at
        columns:
          - name: campaign_id
            description: "Unique identifier for the campaign."
          - name: campaign_name
            description: "Name of the advertising campaign."
          - name: campaign_updated_at
            description: "Timestamp when the campaign record was last updated."