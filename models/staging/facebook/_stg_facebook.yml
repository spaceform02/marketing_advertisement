version: 2

models:
  - name: stg_facebook__ads
    description: "Staging model for Facebook advertisements. Standardizes identifiers, names, status, and update timestamps."
    columns:
      - name: ad_id
        description: "Unique identifier of the advertisement."
        tests:
          - not_null
          - unique
      - name: campaign_id
        description: "Identifier of the campaign associated with the advertisement."
        tests:
          - not_null
          - relationships:
              to: ref('stg_facebook__campaigns') 
              field: campaign_id
      - name: adgroup_id
        description: "Identifier of the ad group associated with the advertisement."
        tests:
          - not_null
          - relationships:
              to: ref('stg_facebook__adgroups') 
              field: adgroup_id
      - name: account_id
        description: "Identifier of the advertising account."
        tests:
          - not_null
          - relationships:
              to: ref('stg_facebook__accounts') 
              field: account_id
      - name: ad_name
        description: "Name of the advertisement."
        tests:
          - not_null
      - name: ad_status
        description: "Current status of the advertisement."
        tests:
          - not_null
          - accepted_values:
              values: ['ACTIVE', 'PAUSED', 'ARCHIVED', 'DELETED']
      - name: ad_updated_at
        description: "Timestamp when the advertisement was last updated."

  - name: stg_facebook__accounts
    description: "Staging model for Facebook advertising accounts."
    columns:
      - name: account_id
        description: "Unique identifier of the advertising account."
        tests:
          - not_null
          - unique
      - name: account_name
        description: "Name of the advertising account."
      - name: currency
        description: "Currency used by the advertising account."
      - name: account_created_at
        description: "Timestamp when the account was created."
      - name: account_updated_at
        description: "Timestamp when the account was last updated."

  - name: stg_facebook__adgroups
    description: "Staging model for Facebook ad groups."
    columns:
      - name: adgroup_id
        description: "Unique identifier of the ad group."
        tests:
          - not_null
          - unique
      - name: adgroup_name
        description: "Name of the ad group."
      - name: adgroup_updated_at
        description: "Timestamp when the ad group was last updated."

  - name: stg_facebook__campaigns
    description: "Staging model for Facebook advertising campaigns."
    columns:
      - name: campaign_id
        description: "Unique identifier of the campaign."
        tests:
          - not_null
          - unique
      - name: campaign_name
        description: "Name of the campaign."
      - name: campaign_updated_at
        description: "Timestamp when the campaign was last updated."

  - name: stg_facebook__ads_stats
    description: "Staging model for Facebook ad performance statistics. Standardizes identifiers, metrics, and performance dates."
    columns:
      - name: ad_id
        description: "Identifier of the advertisement associated with the performance record."
        tests:
          - not_null
          - relationships:
              to: ref('stg_facebook__ads') 
              field: ad_id
      - name: account_id
        description: "Identifier of the advertising account."
        tests:
          - not_null
          - relationships:
              to: ref('stg_facebook__accounts') 
              field: account_id
      - name: ad_spend
        description: "Amount spent on the advertisement."
        tests:
          - not_null
      - name: ad_impressions
        description: "Number of times the advertisement was displayed."
      - name: ad_clicks
        description: "Number of clicks received by the advertisement."
      - name: ad_date
        description: "Date associated with the ad performance record."
        tests:
          - not_null