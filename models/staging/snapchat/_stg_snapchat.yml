version: 2

models:
  - name: stg_snapchat__adgroups
    description: "Staging model for Snapchat ad groups. Standardizes surrogate keys, ad group IDs, and update timestamps."
    columns:
      - name: surrogate_key
        description: "Unique surrogate key for the ad group record."
        tests:
          - not_null
          - unique
      - name: adgroup_id
        description: "Unique identifier for the ad group."
        tests:
          - not_null 
      - name: campaign_id
        description: "Identifier of the campaign associated with the ad group."
        tests:
          - not_null
      - name: adgroup_name
        description: "Name of the ad group."
      - name: adgroup_updated_at
        description: "Timestamp when the ad group was last updated."

  - name: stg_snapchat__ads_stats
    description: "Staging model for Snapchat ad performance statistics and metrics."
    columns:
      - name: ad_detail_id
        description: "Identifier of the ad detail associated with the performance record."
        tests:
          - not_null
          - relationships:
              to: ref('stg_snapchat__ads') 
              field: ad_id
      - name: spend
        description: "Amount spent on the ad."
      - name: impressions
        description: "Number of impressions received."
      - name: clicks
        description: "Number of clicks received."
      - name: currency
        description: "Currency code used for the ad spend."
      - name: country
        description: "Country code associated with the performance data."
        tests:
          - not_null
      - name: ad_date
        description: "Date associated with the ad performance record."
        tests:
          - not_null
      - name: data_src
        description: "Source identifier for the data row."

  - name: stg_snapchat__ads
    description: "Staging model for Snapchat advertisements."
    columns:
      - name: ad_id
        description: "Unique identifier for the advertisement."
        tests:
          - not_null
          - unique
      - name: adgroup_id
        description: "Identifier of the ad group associated with the ad."
        tests:
          - not_null
      - name: ad_name
        description: "Name of the advertisement."
      - name: ad_detail_updated_at
        description: "Timestamp when the ad record was last updated."

  - name: stg_snapchat__campaigns
    description: "Staging model for Snapchat advertising campaigns."
    columns:
      - name: campaign_id
        description: "Unique identifier for the campaign."
        tests:
          - not_null
          - unique
          - relationships:
              to: ref('stg_snapchat__adgroups') 
              field: campaign_id
      - name: account_id
        description: "Identifier of the advertising account."
        tests:
          - not_null
      - name: campaign_name
        description: "Name of the campaign."